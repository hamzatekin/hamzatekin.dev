server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't leak nginx version
    server_tokens off;

    # Security headers (mirrors public/.htaccess)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS is safe to keep on — Coolify terminates TLS in front of this container
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # GZIP compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    # Astro builds with trailingSlash: 'never' and format: 'directory'.
    # Resolve /path -> /path/index.html without forcing a trailing slash.
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    # Hashed build assets are immutable — cache aggressively.
    # Set Cache-Control directly (no `expires`) to avoid a duplicate header.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static assets: cache for 30 days
    location ~* \.(?:jpg|jpeg|gif|png|webp|ico|svg|woff|woff2|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # HTML: short cache so content updates propagate
    location ~* \.html$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Custom 404 page generated by Astro
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
